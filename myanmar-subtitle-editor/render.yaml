# Free-only demonstration deployment. Storage is ephemeral and lost on restart.
# A free instance may not have enough memory for Whisper large-v3.
services:
  - type: web
    name: myanmar-subtitle-editor
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: EDITOR_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MSE_MODEL_SIZE
        value: small
      - key: MSE_COMPUTE_TYPE
        value: int8
      - key: MSE_DEVICE
        value: cpu
      - key: MSE_DEMO_MODE
        value: "off"
