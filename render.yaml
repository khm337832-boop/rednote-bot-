services:
  - type: web
    name: rednote-bot
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Optional: existing downloader settings for restricted source sites.
      - key: XHS_COOKIE
        sync: false
      - key: YTDLP_COOKIES_FILE
        sync: false
